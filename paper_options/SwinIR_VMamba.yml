# SwinIR + VMamba 混合架构配置文件（不含HGT）
# 用于消融实验：测试VMamba单独的贡献
name: SwinIR_VMamba_7to1_64x64
model_type: SimpleClimateModel
scale: 4
num_gpu: 2
manual_seed: 0
fp16: true
auto_resume: true

datasets:
  train:
    name: climate_train
    type: ClimateDatasetWithTopo
    phase: train
    dataroot_gt: "/home/lyb/diffusion/main2 copy/dataset"
    normalize: true
    input_channels: 3
    input_channel_indices: [0, 1, 2]
    use_topo: false
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 20
    prefetch_mode: ~
    pin_memory: true
    persistent_workers: false
  val:
    name: climate_val
    type: ClimateDatasetWithTopo
    phase: val
    dataroot_gt: "/home/lyb/diffusion/main2 copy/dataset"
    normalize: true
    input_channels: 3
    input_channel_indices: [0, 1, 2]
    use_topo: false
    num_worker_per_gpu: 4
    prefetch_mode: ~
    pin_memory: true
    persistent_workers: false

network_g:
  type: SwinIRVMambaClimate
  add_hgt: false  # 关键：不使用HGT，只使用VMamba
  
  img_size: 16
  patch_size: 1
  in_chans: 3
  num_out_ch: 1
  embed_dim: 96
  depths: [6, 6, 6, 6]
  num_heads: [6, 6, 6, 6]
  window_size: [4, 4, 4, 4]
  mlp_ratio: 4
  
  qkv_bias: true
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.05
  patch_norm: true
  use_checkpoint: false
  
  upscale: 4
  img_range: 1.0
  upsampler: pixelshuffle
  resi_connection: 1conv
  activation: none
  
  # VMamba超参数（与完整模型保持一致）
  vmamba_depth: 2
  vmamba_d_state: 16
  vmamba_expand: 2
  vmamba_drop_path: 0.05
  vmamba_directions: 4

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  find_unused_parameters: true
  
  optim_g:
    type: Adam
    lr: !!float 2e-4
    betas: [0.9, 0.99]
    weight_decay: !!float 1e-6
  
  scheduler:
    type: MultiStepLR
    milestones: [5000, 10000, 15000, 20000]
    gamma: 0.8
  
  total_iter: 73060
  warmup_iter: 5000
  
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-3

val:
  val_freq: 20000
  save_img: false
  pbar: true
  
  metrics:
    psnr: {type: calculate_psnr, crop_border: 0, test_y_channel: false, better: higher}
    ssim: {type: calculate_ssim, crop_border: 0, test_y_channel: false, better: higher}
    mae:  {type: calculate_climate_mae,  crop_border: 0, better: lower}
    mse:  {type: calculate_climate_mse,  crop_border: 0, better: lower}
    acc:  {type: calculate_climate_acc_tiles,  crop_border: 0, better: higher}
    psd:  {type: calculate_climate_psd_log,    crop_border: 0, better: lower}

logger:
  print_freq: 2000
  save_checkpoint_freq: 20000
  use_tb_logger: false

dist_params:
  backend: nccl
  port: 29508


