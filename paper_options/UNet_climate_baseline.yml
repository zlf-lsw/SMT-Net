# UNet基线训练配置 - 适配main2/dataset数据集
name: UNet_climate_baseline_7to1_64x64
model_type: SimpleClimateModel  # 使用简化的气候模型
scale: 4  # 16x16 -> 64x64 (4倍上采样)
num_gpu: 2  # 使用两张GPU
manual_seed: 0
fp16: true   # 开启混合精度，降低显存与算力占用

# 数据集配置
datasets:
  train:
    name: climate_train
    type: ClimateDataset
    phase: train
    dataroot_gt: "/home/lyb/diffusion/main2 copy/dataset"  # 指向你的数据集路径
    normalize: true
    # 当前数据为3通道（温度、u风、v风），以温度为目标通道，u和v为辅助
    input_channels: 3
    input_channel_indices: [0, 1, 2]   # 0:温度, 1:u风, 2:v风
    target_channel_index: 0            # 预测温度单变量
    use_topo: false
    
    # 数据加载器设置
    use_shuffle: true
    num_worker_per_gpu: 1    # 降低CPU占用
    batch_size_per_gpu: 20   # 对齐 SRCNN 配置
    prefetch_mode: ~
    
  val:
    name: climate_val  
    type: ClimateDataset
    phase: val             # 使用测试集作为验证集
    dataroot_gt: "/home/lyb/diffusion/main2 copy/dataset"
    normalize: true
    input_channels: 3
    input_channel_indices: [0, 1, 2]
    target_channel_index: 0
    use_topo: false

# 网络结构配置
network_g:
  type: UNet
  add_hgt: false
  upscale: 4
  num_in_ch: 3             # 温度+u+v 3通道输入
  num_out_ch: 1            # 仅预测温度
  activation: none

# 模型路径配置
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# 训练设置
train:
  optim_g:
    type: Adam
    lr: !!float 5e-5       # 降低学习率，减少震荡
    betas: [0.9, 0.99]     # 增强动量，平滑梯度
    weight_decay: !!float 1e-6     # 添加轻微正则化

  scheduler:
    type: MultiStepLR
    milestones: [5000, 10000, 15000, 20000]
    gamma: 0.8

  # 训练迭代设置 (根据数据量调整)
  total_iter: 73060        # 约3小时内完成（视硬件/吞吐调整）
  warmup_iter: 500         # 添加预热，平稳启动

  # 损失函数
  pixel_opt:
    type: CharbonnierLoss   # 使用更平滑的损失函数
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-3

# 验证设置
val:
  val_freq: 10000           # 进一步降低验证频率，减少I/O和开销
  save_img: false           # 对齐 SRCNN 配置
  pbar: true

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      better: higher
    ssim:
      type: calculate_ssim  
      crop_border: 0
      test_y_channel: false
      better: higher
    mae:
      type: calculate_climate_mae
      crop_border: 0
      better: lower
    mse:
      type: calculate_climate_mse
      crop_border: 0
      better: lower
    acc:
      type: calculate_climate_acc_tiles
      crop_border: 0
      better: higher
    psd:
      type: calculate_climate_psd_log
      crop_border: 0
      better: lower


# 日志设置
logger:
  print_freq: 500           # 对齐 SRCNN 配置
  save_checkpoint_freq: 10000  # 减少checkpoint保存次数
  use_tb_logger: true
  # wandb已禁用
  # wandb:
  #   project: climate-downscaling-unet    # 修改为你的项目名
  #   entity: ~                         # 可填你的团队/账号名，留空则用默认
  #   resume_id: ~                      # 断点续跑可填 run id

# 分布式训练设置
dist_params:
  backend: nccl
  port: 29500
